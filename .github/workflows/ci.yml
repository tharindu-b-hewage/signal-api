name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build image
        run: docker build -t signal-api:${{ github.sha }} .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: signal-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 8080:8080 signal-api:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/actuator/health > /dev/null; then
              echo "healthy"
              exit 0
            fi
            sleep 2
          done
          echo "never became healthy"
          docker logs smoke
          exit 1