groups:
  - name: signal-api-slo
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="signal-api",status=~"5.."}[1m]))
          /
          sum(rate(http_server_requests_seconds_count{job="signal-api"}[1m]))
          > 0.05
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "signal-api error rate above 5% SLO threshold"
          description: "More than 5% of requests are failing over a 1 minute window."

      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99,
          sum(rate(http_server_requests_seconds_bucket{job="signal-api"}[1m])) by (le)
          ) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "signal-api p99 latency above 1 second"

      - alert: ServiceDown
        expr: up{job="signal-api"} == 0
        for: 30s
        labels:
          severity: page
        annotations:
          summary: "Prometheus cannot scrape signal-api"